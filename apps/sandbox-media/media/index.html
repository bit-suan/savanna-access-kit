<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savanna Media Access Sandbox</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3f8;color:#21182a;font:16px/1.55 system-ui}main{max-width:960px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd2e7;border-radius:16px;padding:18px;margin:18px 0}video{width:100%;max-height:440px;background:#111}button,input{min-height:40px;padding:8px}button:focus-visible,input:focus-visible{outline:3px solid #e09b00}</style><script type="module">import '../../packages/components/src/sign-window/sign-window.ts';import '../../packages/components/src/audio-description/audio-description.ts';import '../../packages/components/src/offline/offline.ts';import {registerSavannaMediaWorker} from '../../packages/components/src/offline/register-service-worker.ts';registerSavannaMediaWorker('/media-sw.js');</script></head>
<body><main><h1>Savanna Access Kit — Media Access</h1><p>Member 2 isolated test page.</p><section class="card"><h2>Lesson and sign window</h2><video id="lesson" controls playsinline><source src="./media/lesson.mp4" type="video/mp4">Video unavailable.</video><p>Place test video at <code>apps/sandbox-media/media/lesson.mp4</code>.</p><savanna-sign-window src="./media/sign.mp4" offset-ms="0"></savanna-sign-window></section><section class="card"><h2>Audio description</h2><savanna-audio-description src="./media/ad.opus" text-vtt="./media/ad.vtt"></savanna-audio-description></section><section class="card"><h2>Offline pack</h2><label>API <input id="api" value="http://localhost:3000"></label><label>Lesson <input id="lessonId" value="L-102"></label><button id="connect">Connect</button><savanna-offline id="offline" api="http://localhost:3000" lesson-id="L-102"></savanna-offline></section><noscript>JavaScript is disabled; use the lesson host's direct media and transcript links.</noscript></main><script type="module">const v=document.querySelector('#lesson'),s=document.querySelector('savanna-sign-window'),a=document.querySelector('savanna-audio-description');function sync(){const e=new CustomEvent('savanna:timeupdate',{bubbles:true,composed:true,detail:{time:v.currentTime,paused:v.paused,rate:v.playbackRate}});s.dispatchEvent(e);a.dispatchEvent(e);}['timeupdate','play','pause','seeked','ratechange'].forEach(x=>v.addEventListener(x,sync));document.querySelector('#connect').onclick=()=>{const o=document.querySelector('#offline');o.api=document.querySelector('#api').value;o.lessonId=document.querySelector('#lessonId').value;};</script></body></html>
