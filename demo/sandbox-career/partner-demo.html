<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>የሥራ ዕድሎች የአጋር ገጽ</title>
    <style>
      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1rem;
        font:
          1.125rem/1.5 "Noto Sans Ethiopic",
          Nyala,
          system-ui,
          sans-serif;
      }
      savanna-job-card,
      savanna-credential {
        display: block;
        margin-block: 1rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      nav button {
        min-width: 44px;
        min-height: 44px;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid #0b5cab;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <nav aria-label="ቋንቋ / Language">
      <button type="button" data-lang="am" lang="am" aria-pressed="true">አማርኛ</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    </nav>
    <h1 data-am="የሥራ ዕድሎች" data-en="Job opportunities">የሥራ ዕድሎች</h1>
    <savanna-job-card
      job="J-9"
      api="http://localhost:4020"
      api-key="pk_live_demo"
      lang="am"
    ></savanna-job-card>
    <savanna-credential
      id="C-7"
      api="http://localhost:4020"
      api-key="pk_live_demo"
      lang="am"
    ></savanna-credential>
    <script type="module">
      await import(/* @vite-ignore */ `/dist/savanna-career.v1.js?build=${Date.now()}`);
      const buttons = [...document.querySelectorAll("[data-lang]")];
      const components = [...document.querySelectorAll("savanna-job-card, savanna-credential")];
      document.querySelector("nav")?.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-lang]");
        if (!button) return;
        const lang = button.dataset.lang;
        document.documentElement.lang = lang;
        document.querySelector("h1").textContent = document.querySelector("h1").dataset[lang];
        document.title = lang === "am" ? "የሥራ ዕድሎች የአጋር ገጽ" : "Partner job opportunities";
        buttons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        components.forEach((element) => element.setAttribute("lang", lang));
        window.dispatchEvent(new CustomEvent("savanna:lang-change", { detail: { lang } }));
      });
    </script>
  </body>
</html>
